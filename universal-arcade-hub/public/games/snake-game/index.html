<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Snake Game</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .wrap {
      text-align: center;
    }

    canvas {
      border: 4px solid white;
      background: black;
    }

    button {
      padding: 14px 24px;
      margin: 8px;
      border: 0;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="800" height="600"></canvas>
    <p>Arrow Keys = Move | Enter = Menu | D = Toggle Dark Mode</p>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const screenWidth = 800;
    const screenHeight = 600;
    const cellSize = 20;
    const gridWidth = screenWidth / cellSize;
    const gridHeight = screenHeight / cellSize;

    let gameState = "menu";
    let snake = [{ x: 10, y: 10 }];
    let food = randomFood();
    let direction = { x: 1, y: 0 };
    let score = 0;
    let darkMode = true;

    const buttons = {
      start: { x: 300, y: 200, w: 200, h: 50, text: "START GAME" },
      options: { x: 300, y: 280, w: 200, h: 50, text: "OPTIONS" },
      exit: { x: 300, y: 360, w: 200, h: 50, text: "EXIT" },
      back: { x: 300, y: 450, w: 200, h: 50, text: "BACK" },
    };

    function randomFood() {
      return {
        x: Math.floor(Math.random() * gridWidth),
        y: Math.floor(Math.random() * gridHeight),
      };
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }];
      direction = { x: 1, y: 0 };
      food = randomFood();
      score = 0;
      gameState = "playing";
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" && direction.y === 0) direction = { x: 0, y: -1 };
      if (e.key === "ArrowDown" && direction.y === 0) direction = { x: 0, y: 1 };
      if (e.key === "ArrowLeft" && direction.x === 0) direction = { x: -1, y: 0 };
      if (e.key === "ArrowRight" && direction.x === 0) direction = { x: 1, y: 0 };

      if (e.key.toLowerCase() === "d" && gameState === "options") {
        darkMode = !darkMode;
      }

      if (e.key === "Enter" && gameState === "gameover") {
        gameState = "menu";
      }
    });

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouse = {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top,
      };

      if (gameState === "menu") {
        if (inside(mouse, buttons.start)) resetGame();
        if (inside(mouse, buttons.options)) gameState = "options";
        if (inside(mouse, buttons.exit)) gameState = "menu";
      }

      if (gameState === "options") {
        if (inside(mouse, buttons.back)) gameState = "menu";
      }
    });

    function inside(point, button) {
      return (
        point.x >= button.x &&
        point.x <= button.x + button.w &&
        point.y >= button.y &&
        point.y <= button.y + button.h
      );
    }

    function update() {
      if (gameState !== "playing") return;

      const newHead = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y,
      };

      snake.unshift(newHead);

      if (newHead.x === food.x && newHead.y === food.y) {
        score++;
        food = randomFood();
      } else {
        snake.pop();
      }

      if (
        newHead.x < 0 ||
        newHead.x >= gridWidth ||
        newHead.y < 0 ||
        newHead.y >= gridHeight
      ) {
        gameState = "gameover";
      }

      for (let i = 1; i < snake.length; i++) {
        if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
          gameState = "gameover";
        }
      }
    }

    function drawButton(button, color) {
      ctx.fillStyle = color;
      ctx.fillRect(button.x, button.y, button.w, button.h);
      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText(button.text, button.x + 25, button.y + 32);
    }

    function draw() {
      const bg = darkMode ? "black" : "#f5f5f5";
      const text = darkMode ? "white" : "black";

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, screenWidth, screenHeight);

      if (gameState === "menu") {
        ctx.fillStyle = "limegreen";
        ctx.font = "50px Arial";
        ctx.fillText("SNAKE GAME", 240, 100);

        drawButton(buttons.start, "darkgreen");
        drawButton(buttons.options, "darkblue");
        drawButton(buttons.exit, "maroon");
      }

      if (gameState === "options") {
        ctx.fillStyle = text;
        ctx.font = "50px Arial";
        ctx.fillText("OPTIONS", 300, 100);
        ctx.font = "25px Arial";
        ctx.fillText("Press D to Toggle Dark Mode", 180, 250);
        drawButton(buttons.back, "gray");
      }

      if (gameState === "playing") {
        ctx.fillStyle = "green";
        for (const segment of snake) {
          ctx.fillRect(segment.x * cellSize, segment.y * cellSize, cellSize, cellSize);
        }

        ctx.fillStyle = "red";
        ctx.fillRect(food.x * cellSize, food.y * cellSize, cellSize, cellSize);

        ctx.fillStyle = text;
        ctx.font = "25px Arial";
        ctx.fillText(`Score: ${score}`, 10, 30);
      }

      if (gameState === "gameover") {
        ctx.fillStyle = "red";
        ctx.font = "50px Arial";
        ctx.fillText("GAME OVER", 240, 200);

        ctx.fillStyle = text;
        ctx.font = "30px Arial";
        ctx.fillText(`Final Score: ${score}`, 290, 280);

        ctx.font = "25px Arial";
        ctx.fillText("Press ENTER To Return To Menu", 170, 380);
      }
    }

    function loop() {
      update();
      draw();
    }

    setInterval(loop, 100);
  </script>
</body>
</html>
