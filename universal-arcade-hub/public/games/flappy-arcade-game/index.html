<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Dash</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #18233f, #070912 70%);
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      overflow: hidden;
    }
    .shell {
      width: min(94vw, 540px);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      letter-spacing: 1px;
      font-size: 34px;
    }
    canvas {
      width: 100%;
      max-width: 540px;
      height: auto;
      display: block;
      border: 4px solid rgba(255,255,255,0.9);
      border-radius: 22px;
      background: #7fd6ff;
      box-shadow: 0 24px 70px rgba(0,0,0,0.5);
      touch-action: manipulation;
    }
    .hint {
      margin: 12px 0 0;
      color: #d7defa;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="shell">
    <h1>Flappy Dash</h1>
    <canvas id="game" width="540" height="720"></canvas>
    <p class="hint">Space / Click / Tap = Flap · P = Pause · R = Restart</p>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const W = canvas.width;
    const H = canvas.height;

    const state = {
      mode: 'menu',
      score: 0,
      best: Number(localStorage.getItem('flappyDashBest') || 0),
      time: 0,
      shake: 0,
      paused: false
    };

    const bird = {
      x: 150,
      y: 280,
      r: 19,
      vy: 0,
      gravity: 1500,
      flap: -470,
      rotation: 0
    };

    let pipes = [];
    let particles = [];
    let lastTime = 0;
    let spawnTimer = 0;

    const pipe = {
      width: 78,
      gap: 180,
      speed: 230,
      spawnEvery: 1.45
    };

    function reset() {
      bird.y = 280;
      bird.vy = 0;
      bird.rotation = 0;
      pipes = [];
      particles = [];
      spawnTimer = 0;
      state.score = 0;
      state.time = 0;
      state.shake = 0;
      state.paused = false;
      state.mode = 'playing';
      spawnPipe();
    }

    function spawnPipe() {
      const margin = 90;
      const gapY = margin + Math.random() * (H - margin * 2 - pipe.gap);
      pipes.push({
        x: W + 40,
        topH: gapY,
        bottomY: gapY + pipe.gap,
        scored: false
      });
    }

    function flap() {
      if (state.mode === 'menu' || state.mode === 'gameover') {
        reset();
        return;
      }
      if (state.mode !== 'playing' || state.paused) return;
      bird.vy = bird.flap;
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: bird.x - 12,
          y: bird.y + 6,
          vx: -80 - Math.random() * 120,
          vy: -80 + Math.random() * 160,
          life: 0.35,
          max: 0.35
        });
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
      if (e.key.toLowerCase() === 'r') reset();
      if (e.key.toLowerCase() === 'p' && state.mode === 'playing') state.paused = !state.paused;
    });

    canvas.addEventListener('pointerdown', flap);

    function update(dt) {
      if (state.mode !== 'playing' || state.paused) return;

      state.time += dt;
      state.shake = Math.max(0, state.shake - dt * 20);

      bird.vy += bird.gravity * dt;
      bird.y += bird.vy * dt;
      bird.rotation = Math.max(-0.45, Math.min(0.9, bird.vy / 650));

      spawnTimer += dt;
      if (spawnTimer >= pipe.spawnEvery) {
        spawnTimer = 0;
        spawnPipe();
      }

      for (const p of pipes) {
        p.x -= pipe.speed * dt;
        if (!p.scored && p.x + pipe.width < bird.x) {
          p.scored = true;
          state.score++;
          state.best = Math.max(state.best, state.score);
          localStorage.setItem('flappyDashBest', state.best);
        }
      }
      pipes = pipes.filter(p => p.x + pipe.width > -40);

      for (const dust of particles) {
        dust.x += dust.vx * dt;
        dust.y += dust.vy * dt;
        dust.life -= dt;
      }
      particles = particles.filter(p => p.life > 0);

      if (bird.y - bird.r < 0 || bird.y + bird.r > H - 78) die();

      for (const p of pipes) {
        const hitX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + pipe.width;
        const hitTop = bird.y - bird.r < p.topH;
        const hitBottom = bird.y + bird.r > p.bottomY;
        if (hitX && (hitTop || hitBottom)) die();
      }
    }

    function die() {
      if (state.mode !== 'playing') return;
      state.mode = 'gameover';
      state.shake = 12;
      state.best = Math.max(state.best, state.score);
      localStorage.setItem('flappyDashBest', state.best);
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#78dbff');
      sky.addColorStop(0.58, '#83e7c8');
      sky.addColorStop(1, '#2d7a62');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      for (let i = 0; i < 5; i++) {
        const x = ((state.time * -30 + i * 155) % (W + 180)) - 90;
        const y = 80 + (i % 3) * 55;
        ctx.beginPath();
        ctx.arc(x, y, 25, 0, Math.PI * 2);
        ctx.arc(x + 28, y - 8, 32, 0, Math.PI * 2);
        ctx.arc(x + 64, y, 26, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#246b4b';
      ctx.fillRect(0, H - 78, W, 78);
      ctx.fillStyle = '#35a96e';
      ctx.fillRect(0, H - 78, W, 16);
      ctx.fillStyle = 'rgba(255,255,255,0.13)';
      for (let x = -40; x < W + 40; x += 44) {
        ctx.fillRect((x - state.time * 80) % (W + 44), H - 45, 22, 6);
      }
    }

    function drawPipes() {
      for (const p of pipes) {
        const grad = ctx.createLinearGradient(p.x, 0, p.x + pipe.width, 0);
        grad.addColorStop(0, '#157a3e');
        grad.addColorStop(0.5, '#3fdb71');
        grad.addColorStop(1, '#0f6835');
        ctx.fillStyle = grad;
        roundRect(p.x, -20, pipe.width, p.topH + 20, 16);
        roundRect(p.x, p.bottomY, pipe.width, H - p.bottomY - 78, 16);

        ctx.fillStyle = '#59f088';
        roundRect(p.x - 10, p.topH - 24, pipe.width + 20, 28, 10);
        roundRect(p.x - 10, p.bottomY - 4, pipe.width + 20, 28, 10);
      }
    }

    function drawBird() {
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);

      ctx.fillStyle = '#ffd447';
      ctx.beginPath();
      ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffb02e';
      ctx.beginPath();
      ctx.ellipse(-8, 5, 12, 8, -0.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ff7a2f';
      ctx.beginPath();
      ctx.moveTo(15, -2);
      ctx.lineTo(34, 5);
      ctx.lineTo(15, 11);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(8, -8, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(10, -7, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawHud() {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      roundRect(18, 18, 150, 58, 18);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 26px Arial';
      ctx.fillText(`Score ${state.score}`, 35, 55);

      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      roundRect(W - 152, 18, 134, 58, 18);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 22px Arial';
      ctx.fillText(`Best ${state.best}`, W - 126, 54);
    }

    function drawOverlay(title, subtitle) {
      ctx.fillStyle = 'rgba(5, 8, 20, 0.68)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.font = 'bold 48px Arial';
      ctx.fillText(title, W / 2, 250);
      ctx.font = '22px Arial';
      ctx.fillStyle = '#e7ecff';
      ctx.fillText(subtitle, W / 2, 300);
      ctx.fillStyle = '#ffd447';
      ctx.font = 'bold 18px Arial';
      ctx.fillText('Click, tap, or press Space', W / 2, 345);
      ctx.textAlign = 'left';
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.max);
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function draw() {
      ctx.save();
      if (state.shake > 0) {
        ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
      }
      drawBackground();
      drawPipes();
      drawParticles();
      drawBird();
      drawHud();

      if (state.mode === 'menu') drawOverlay('FLAPPY DASH', 'Dodge the pipes. Chase the high score.');
      if (state.mode === 'gameover') drawOverlay('GAME OVER', `Score ${state.score} · Best ${state.best}`);
      if (state.paused) drawOverlay('PAUSED', 'Press P to continue');
      ctx.restore();
    }

    function loop(t) {
      const dt = Math.min(0.033, (t - lastTime) / 1000 || 0);
      lastTime = t;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
