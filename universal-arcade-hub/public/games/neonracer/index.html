<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Drift</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050510;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1100px;
      max-height: 720px;
      background: radial-gradient(circle at center, #11143a 0%, #050510 70%);
      overflow: hidden;
      border: 2px solid rgba(0, 255, 255, 0.35);
      box-shadow: 0 0 35px rgba(0, 255, 255, 0.18);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(180deg, #06061a, #080821);
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      z-index: 3;
    }

    .pill {
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      background: rgba(5, 5, 16, 0.62);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 18px rgba(0,255,255,0.12);
      font-size: 14px;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }

    .center-card {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      background: radial-gradient(circle, rgba(8, 8, 30, 0.35), rgba(5, 5, 16, 0.88));
      padding: 24px;
    }

    .menu {
      width: min(560px, 94vw);
      padding: 30px;
      border-radius: 28px;
      border: 1px solid rgba(0,255,255,0.25);
      background: rgba(7, 9, 27, 0.88);
      box-shadow: 0 0 50px rgba(0,255,255,0.13), inset 0 0 26px rgba(255,255,255,0.04);
      text-align: center;
    }

    .menu h1 {
      font-size: clamp(42px, 8vw, 78px);
      line-height: 0.92;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 14px;
      text-shadow: 0 0 18px rgba(0,255,255,0.75), 0 0 40px rgba(255,0,255,0.35);
    }

    .menu p {
      color: rgba(255,255,255,0.78);
      line-height: 1.5;
      margin-bottom: 18px;
      font-size: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 20px 0;
      text-align: left;
    }

    .control-box {
      padding: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.84);
      font-size: 13px;
    }

    .control-box strong {
      display: block;
      color: #fff;
      margin-bottom: 4px;
    }

    button {
      border: 0;
      cursor: pointer;
      padding: 14px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #00f5ff, #ff2eea);
      color: #050510;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 24px rgba(0,245,255,0.32);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.08);
    }

    .hidden {
      display: none;
    }

    .mobile-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      display: none;
      justify-content: space-between;
      align-items: end;
      padding: 0 18px;
      z-index: 4;
      pointer-events: none;
    }

    .mobile-group {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .mobile-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.09);
      color: white;
      font-size: 24px;
      display: grid;
      place-items: center;
      user-select: none;
      touch-action: none;
      backdrop-filter: blur(8px);
    }

    @media (max-width: 760px) {
      .game-wrap {
        max-width: none;
        max-height: none;
        border: 0;
      }

      .hud {
        top: 10px;
        left: 10px;
        right: 10px;
      }

      .pill {
        padding: 8px 10px;
        font-size: 12px;
      }

      .mobile-controls {
        display: flex;
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="game-wrap" id="gameWrap">
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
      <div class="pill">Score: <span id="score">0</span></div>
      <div class="pill">Speed: <span id="speed">0</span></div>
      <div class="pill">Best: <span id="best">0</span></div>
    </div>

    <div class="mobile-controls">
      <div class="mobile-group">
        <div class="mobile-btn" data-key="ArrowLeft">←</div>
        <div class="mobile-btn" data-key="ArrowRight">→</div>
      </div>
      <div class="mobile-group">
        <div class="mobile-btn" data-key="ArrowUp">▲</div>
        <div class="mobile-btn" data-key="ArrowDown">▼</div>
      </div>
    </div>

    <div class="center-card" id="startScreen">
      <div class="menu">
        <h1>Neon<br>Drift</h1>
        <p>Dodge traffic, collect neon coins, and survive as long as you can. The road gets faster the longer you last.</p>
        <div class="controls">
          <div class="control-box"><strong>Move</strong>Arrow keys or WASD</div>
          <div class="control-box"><strong>Boost</strong>Hold up / W</div>
          <div class="control-box"><strong>Brake</strong>Hold down / S</div>
          <div class="control-box"><strong>Goal</strong>Collect coins, avoid cars</div>
        </div>
        <button id="startBtn">Start Game</button>
      </div>
    </div>

    <div class="center-card hidden" id="gameOverScreen">
      <div class="menu">
        <h1>Crash!</h1>
        <p id="finalText">You scored 0.</p>
        <button id="restartBtn">Restart</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const speedEl = document.getElementById("speed");
    const bestEl = document.getElementById("best");
    const startScreen = document.getElementById("startScreen");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const finalText = document.getElementById("finalText");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");

    let W = 1100;
    let H = 720;
    let scale = 1;
    let running = false;
    let gameOver = false;
    let animationId = null;
    let loopActive = false;
    let lastTime = 0;
    let roadOffset = 0;
    let score = 0;
    let best = Number(localStorage.getItem("neonDriftBest") || 0);
    let worldSpeed = 340;
    let spawnTimer = 0;
    let coinTimer = 0;
    let shake = 0;

    const keys = new Set();
    const cars = [];
    const coins = [];
    const particles = [];

    const player = {
      x: 0,
      y: 0,
      w: 46,
      h: 78,
      vx: 0,
      glow: 0,
    };

    function resize() {
      const wrap = document.getElementById("gameWrap");
      const rect = wrap.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = rect.width;
      H = rect.height;
      scale = Math.min(W / 1100, H / 720);
    }

    window.addEventListener("resize", resize);
    resize();

    function resetGame() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      loopActive = false;
      cars.length = 0;
      coins.length = 0;
      particles.length = 0;
      score = 0;
      worldSpeed = 340;
      spawnTimer = 0;
      coinTimer = 0;
      roadOffset = 0;
      shake = 0;
      player.w = 44 * scale;
      player.h = 76 * scale;
      player.x = W / 2 - player.w / 2;
      player.y = H - player.h - 58 * scale;
      player.vx = 0;
      running = true;
      gameOver = false;
      startScreen.classList.add("hidden");
      gameOverScreen.classList.add("hidden");
      lastTime = performance.now();
      loopActive = true;
      animationId = requestAnimationFrame(loop);
    }

    startBtn.addEventListener("click", resetGame);
    restartBtn.addEventListener("click", resetGame);

    window.addEventListener("keydown", (e) => {
      keys.add(e.key);
      if ((e.key === " " || e.key === "Enter") && !running) resetGame();
    });

    window.addEventListener("keyup", (e) => keys.delete(e.key));

    document.querySelectorAll(".mobile-btn").forEach((btn) => {
      const key = btn.dataset.key;
      const down = (e) => {
        e.preventDefault();
        keys.add(key);
      };
      const up = (e) => {
        e.preventDefault();
        keys.delete(key);
      };
      btn.addEventListener("pointerdown", down);
      btn.addEventListener("pointerup", up);
      btn.addEventListener("pointercancel", up);
      btn.addEventListener("pointerleave", up);
    });

    function roadBounds() {
      const roadW = Math.min(W * 0.72, 720 * scale);
      const left = W / 2 - roadW / 2;
      const right = W / 2 + roadW / 2;
      return { left, right, roadW };
    }

    function randomLaneX(width) {
      const { left, roadW } = roadBounds();
      const lanes = 4;
      const lane = Math.floor(Math.random() * lanes);
      const laneW = roadW / lanes;
      return left + laneW * lane + laneW / 2 - width / 2;
    }

    function spawnCar() {
      const w = (42 + Math.random() * 22) * scale;
      const h = (72 + Math.random() * 18) * scale;
      cars.push({
        x: randomLaneX(w),
        y: -h - 20,
        w,
        h,
        speed: worldSpeed * (0.72 + Math.random() * 0.32),
        color: Math.random() > 0.5 ? "#ff2eea" : "#00f5ff",
      });
    }

    function spawnCoin() {
      const size = 22 * scale;
      coins.push({
        x: randomLaneX(size),
        y: -size - 20,
        size,
        speed: worldSpeed * 0.9,
        spin: Math.random() * Math.PI * 2,
      });
    }

    function addBurst(x, y, amount, strong = false) {
      for (let i = 0; i < amount; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = (strong ? 180 : 90) * Math.random() + 40;
        particles.push({
          x,
          y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: strong ? 0.65 : 0.42,
          max: strong ? 0.65 : 0.42,
          size: (strong ? 5 : 3) * Math.random() + 2,
        });
      }
    }

    function rectsHit(a, b) {
      return a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y;
    }

    function update(dt) {
      const leftPressed = keys.has("ArrowLeft") || keys.has("a") || keys.has("A");
      const rightPressed = keys.has("ArrowRight") || keys.has("d") || keys.has("D");
      const boostPressed = keys.has("ArrowUp") || keys.has("w") || keys.has("W");
      const brakePressed = keys.has("ArrowDown") || keys.has("s") || keys.has("S");

      const targetSpeed = boostPressed ? 520 : brakePressed ? 250 : 370;
      worldSpeed += (targetSpeed - worldSpeed) * Math.min(1, dt * 1.7);
      worldSpeed += dt * 4.8;

      const accel = 1600 * scale;
      const maxVX = 470 * scale;

      if (leftPressed) player.vx -= accel * dt;
      if (rightPressed) player.vx += accel * dt;
      if (!leftPressed && !rightPressed) player.vx *= Math.pow(0.0008, dt);
      player.vx = Math.max(-maxVX, Math.min(maxVX, player.vx));
      player.x += player.vx * dt;

      const { left, right } = roadBounds();
      player.x = Math.max(left + 16 * scale, Math.min(right - player.w - 16 * scale, player.x));

      roadOffset += worldSpeed * dt;
      score += dt * (worldSpeed * 0.06);

      spawnTimer -= dt;
      coinTimer -= dt;

      const spawnEvery = Math.max(0.42, 1.08 - score / 2800);
      if (spawnTimer <= 0) {
        spawnCar();
        spawnTimer = spawnEvery;
      }

      if (coinTimer <= 0) {
        spawnCoin();
        coinTimer = 0.72 + Math.random() * 0.65;
      }

      for (let i = cars.length - 1; i >= 0; i--) {
        const car = cars[i];
        car.y += car.speed * dt;
        if (car.y > H + 120) cars.splice(i, 1);
        if (rectsHit(player, car)) endGame();
      }

      for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];
        coin.y += coin.speed * dt;
        coin.spin += dt * 8;
        if (coin.y > H + 80) coins.splice(i, 1);

        const coinBox = { x: coin.x, y: coin.y, w: coin.size, h: coin.size };
        if (rectsHit(player, coinBox)) {
          score += 120;
          addBurst(coin.x + coin.size / 2, coin.y + coin.size / 2, 14);
          coins.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= Math.pow(0.08, dt);
        p.vy *= Math.pow(0.08, dt);
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (shake > 0) shake -= dt;

      scoreEl.textContent = Math.floor(score);
      speedEl.textContent = Math.floor(worldSpeed / 10);
      bestEl.textContent = best;
    }

    function endGame() {
      if (gameOver) return;
      gameOver = true;
      running = false;
      shake = 0.5;
      addBurst(player.x + player.w / 2, player.y + player.h / 2, 42, true);
      const finalScore = Math.floor(score);
      if (finalScore > best) {
        best = finalScore;
        localStorage.setItem("neonDriftBest", best);
      }
      finalText.textContent = `You scored ${finalScore}. Best score: ${best}.`;
      setTimeout(() => {
        gameOverScreen.classList.remove("hidden");
      }, 450);
    }

    function drawRoad() {
      const { left, right, roadW } = roadBounds();
      const grd = ctx.createLinearGradient(left, 0, right, 0);
      grd.addColorStop(0, "#111126");
      grd.addColorStop(0.5, "#18183a");
      grd.addColorStop(1, "#111126");
      ctx.fillStyle = grd;
      ctx.fillRect(left, 0, roadW, H);

      ctx.shadowBlur = 22;
      ctx.shadowColor = "#00f5ff";
      ctx.strokeStyle = "rgba(0,245,255,0.72)";
      ctx.lineWidth = 4 * scale;
      ctx.beginPath();
      ctx.moveTo(left, 0);
      ctx.lineTo(left, H);
      ctx.moveTo(right, 0);
      ctx.lineTo(right, H);
      ctx.stroke();
      ctx.shadowBlur = 0;

      const lanes = 4;
      const laneW = roadW / lanes;
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.lineWidth = 2 * scale;
      ctx.setLineDash([26 * scale, 24 * scale]);
      ctx.lineDashOffset = -roadOffset * 0.55;
      for (let i = 1; i < lanes; i++) {
        const x = left + laneW * i;
        ctx.beginPath();
        ctx.moveTo(x, -60);
        ctx.lineTo(x, H + 60);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function drawCar(car, isPlayer = false) {
      const x = car.x;
      const y = car.y;
      const w = car.w;
      const h = car.h;
      const color = isPlayer ? "#fff" : car.color;
      const glow = isPlayer ? "#00f5ff" : car.color;

      ctx.save();
      ctx.shadowBlur = isPlayer ? 22 : 16;
      ctx.shadowColor = glow;
      roundRect(x, y, w, h, 12 * scale);
      ctx.fillStyle = color;
      ctx.fill();

      roundRect(x + w * 0.18, y + h * 0.16, w * 0.64, h * 0.24, 8 * scale);
      ctx.fillStyle = "rgba(5,5,16,0.68)";
      ctx.fill();

      roundRect(x + w * 0.14, y + h * 0.58, w * 0.72, h * 0.18, 8 * scale);
      ctx.fillStyle = isPlayer ? "#00f5ff" : "rgba(255,255,255,0.76)";
      ctx.fill();

      ctx.fillStyle = "rgba(5,5,16,0.95)";
      roundRect(x - w * 0.08, y + h * 0.18, w * 0.14, h * 0.18, 4 * scale);
      ctx.fill();
      roundRect(x + w * 0.94, y + h * 0.18, w * 0.14, h * 0.18, 4 * scale);
      ctx.fill();
      roundRect(x - w * 0.08, y + h * 0.66, w * 0.14, h * 0.18, 4 * scale);
      ctx.fill();
      roundRect(x + w * 0.94, y + h * 0.66, w * 0.14, h * 0.18, 4 * scale);
      ctx.fill();
      ctx.restore();
    }

    function drawCoin(coin) {
      const cx = coin.x + coin.size / 2;
      const cy = coin.y + coin.size / 2;
      const squash = Math.abs(Math.cos(coin.spin)) * 0.72 + 0.28;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(squash, 1);
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#ffe66d";
      ctx.fillStyle = "#ffe66d";
      ctx.beginPath();
      ctx.arc(0, 0, coin.size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(5,5,16,0.8)";
      ctx.font = `${Math.max(10, 14 * scale)}px Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("$", 0, 1);
      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        const alpha = Math.max(0, p.life / p.max);
        ctx.globalAlpha = alpha;
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#00f5ff";
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    function drawBackground() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#050510";
      ctx.fillRect(0, 0, W, H);

      const dotGap = 56 * scale;
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      for (let y = (roadOffset * 0.15) % dotGap; y < H; y += dotGap) {
        for (let x = 0; x < W; x += dotGap) {
          if (Math.abs(x - W / 2) < roadBounds().roadW / 2 + 40) continue;
          ctx.beginPath();
          ctx.arc(x, y, 1.5 * scale, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function draw() {
      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * 14 * shake, (Math.random() - 0.5) * 14 * shake);
      }
      drawBackground();
      drawRoad();
      coins.forEach(drawCoin);
      cars.forEach((car) => drawCar(car, false));
      drawCar(player, true);
      drawParticles();
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function loop(now) {
      if (!loopActive) return;

      const dt = Math.min(0.033, (now - lastTime) / 1000 || 0.016);
      lastTime = now;

      if (running) update(dt);
      draw();

      if (running || shake > 0 || particles.length) {
        animationId = requestAnimationFrame(loop);
      } else {
        animationId = null;
        loopActive = false;
      }
    }

    bestEl.textContent = best;
    draw();
  </script>
</body>
</html>
